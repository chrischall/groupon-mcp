version: 1
name: Groupon
slug: groupon
summary: >-
  Groupon deals for Claude — search and browse local, goods, and travel
  deals via natural language
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: GROUPON_GRAPHQL_URL
    required: false
    help: >-
      Overrides the upstream API base URL. Leave unset for the default; if you
      change it, update egress.allow to match.
  - name: GROUPON_SESSION_COOKIE
    secret: true
    required: false
    help: >-
      An authenticated groupon.com `Cookie` header, required for cart operations
      (anonymous reads do not need it). Falls back to lifting the cookie from a
      signed-in browser tab unless GROUPON_DISABLE_FETCHPROXY is set.
  - name: GROUPON_DISABLE_FETCHPROXY
    required: false
    help: >-
      Set to 1 to disable the browser-bridge fallback that lifts the session
      cookie from a signed-in tab, making a missing GROUPON_SESSION_COOKIE a
      hard error. Recommended when hosted, where there is no browser.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    #
    # Every mode dials the same one host. Anonymous deal reads
    # (src/client.ts) and cookie-authenticated cart calls
    # (src/web-client.ts) are both plain process fetches of
    # https://www.groupon.com/mobilenextapi/graphql; the browser bridge
    # (src/fetchproxy-cookie.ts) only LIFTS the Cookie header out of the
    # signed-in tab — it never carries the request, so the process dials
    # www.groupon.com whether the cookie came from the env or the bridge.
    # The endpoint answers directly (no redirect hop). The apex
    # `groupon.com` is only the bridge's cookie SCOPE and never dialled;
    # `www.groupon.com/checkout/cart` is a URL cart tools build and RETURN.
    # GROUPON_GRAPHQL_URL replaces the host at runtime — add it here if set.
    - www.groupon.com
